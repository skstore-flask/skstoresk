<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — {{ store_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='img/sk-logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="form-card login-card">
    <div style="text-align:center;margin-bottom:18px">
      <img src="{{ url_for('static', filename='img/sk-logo.png') }}" alt="SK Store" style="width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 24px rgba(201,150,46,.5)">
      <h2 style="margin-top:12px">🔐 Admin Login</h2>
    </div>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label>User ID</label><input type="text" name="username" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-block" type="submit">Login</button>
    </form>
    <div style="text-align:center;margin-top:14px"><a href="{{ url_for('index') }}" style="font-size:13px">← Back to site</a></div>
  </div>
</div>
</body>
</html>
