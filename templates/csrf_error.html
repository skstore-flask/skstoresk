{% extends "base.html" %}
{% block title %}Session expired — {{ store_name }}{% endblock %}
{% block content %}
<div class="form-card" style="text-align:center">
  <div style="font-size:56px">🔄</div>
  <h2>Session expired</h2>
  <p style="color:var(--muted)">This usually happens if the page was left open too long or a form was submitted twice.<br>Don't worry — nothing was charged or lost.</p><br>
  <a class="btn" href="{{ url_for('index') }}">🏠 Back to Home</a>
  <button class="btn btn-ghost" onclick="history.back()" style="margin-left:8px">← Go Back &amp; Retry</button>
</div>
{% endblock %}
